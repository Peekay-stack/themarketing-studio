  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x 14px; font-size:14px; line-height:1.6; color:#2A3A2E; resize:vertical; background:#FCFAF3;\"><\u002Ftextarea>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- footer actions -->\n    <div style=\"display:flex; align-items:center; gap:12px; margin-top:28px; padding-top:24px; border-top:1px solid #ECE3CE;\">\n      <button style=\"background:#fff; color:#6E7E62; border:1px solid #ECE3CE; border-radius:12px; padding:13px 20px; font-weight:700; font-size:14px; cursor:pointer;\">Save draft<\u002Fbutton>\n      <button onclick=\"{{ openLauncher }}\" style=\"background:#E8A93C; color:#3A2A06; border:none; border-radius:12px; padding:13px 20px; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:8px;\"><span style=\"font-size:16px; line-height:1;\">✦<\u002Fspan>Create content from brief<\u002Fbutton>\n      <sc-if value=\"{{ reviewerMode }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; gap:12px; margin-left:auto;\">\n          <button onclick=\"{{ requestChanges }}\" style=\"background:#FBE3E1; color:#C0392B; border:none; border-radius:12px; padding:13px 22px; font-weight:700; font-size:14px; cursor:pointer;\">Request changes<\u002Fbutton>\n          <button onclick=\"{{ approve }}\" style=\"background:#259821; color:#fff; border:none; border-radius:12px; padding:13px 22px; font-weight:700; font-size:14px; cursor:pointer;\">Approve brief<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ managerMode }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex; gap:12px; margin-left:auto;\">\n          <button style=\"background:#fff; color:#6E7E62; border:1px solid #ECE3CE; border-radius:12px; padding:13px 20px; font-weight:700; font-size:14px; cursor:pointer;\">Share with agency<\u002Fbutton>\n          <button onclick=\"{{ submit }}\" style=\"background:#259821; color:#fff; border:none; border-radius:12px; padding:13px 22px; font-weight:700; font-size:14px; cursor:pointer;\">Submit for approval<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== HISTORY ===================== -->\n  <sc-if value=\"{{ isHistory }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1240px; margin:0 auto; padding:36px 40px 80px; animation:hf-fade 0.4s ease;\">\n    <div style=\"margin-bottom:8px; font-size:13px; font-weight:700; letter-spacing:0.06em; color:#259821; text-transform:uppercase;\">History<\u002Fdiv>\n    <h1 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:34px; font-weight:700; letter-spacing:-0.02em; margin:0 0 6px; color:#14331F;\">Everything your team has made<\u002Fh1>\n    <p style=\"font-size:15px; color:#7A8A7E; margin:0 0 24px; max-width:640px;\">Briefs, posts, videos and campaign reports — across every format and stage of approval.<\u002Fp>\n\n    <div style=\"display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;\">\n      <sc-for list=\"{{ historyFilters }}\" as=\"hf\" hint-placeholder-count=\"5\">\n        <span onclick=\"{{ hf.set }}\" style=\"cursor:pointer; font-size:14px; font-weight:700; padding:9px 16px; border-radius:30px; background:{{ hf.bg }}; color:{{ hf.fg }}; border:1px solid {{ hf.border }};\">{{ hf.label }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff; border-radius:18px; border:1px solid #ECE3CE; overflow:hidden;\">\n      <div style=\"display:grid; grid-template-columns:2.4fr 1fr 1.1fr 0.9fr; gap:16px; padding:14px 24px; background:#FCFAF3; border-bottom:1px solid #ECE3CE; font-size:12px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#A0937A;\">\n        <span>Item<\u002Fspan><span>Type · Format<\u002Fspan><span>Owner<\u002Fspan><span style=\"text-align:right;\">Status<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for li t:700; letter-spacing:-0.02em; margin:0 0 6px; color:#14331F;\">One idea, every platform<\u002Fh1>\n    <p style=\"font-size:15px; color:#7A8A7E; margin:0 0 22px; max-width:640px;\">Describe an objective and generate captions, hashtags and live previews for Facebook, Instagram and LinkedIn at once.<\u002Fp>\n\n    <!-- linked brief chip / callout -->\n    <sc-if value=\"{{ hasLinkedBrief }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:inline-flex; align-items:center; gap:12px; background:#EAF6EC; border:1px solid #C9E7CE; border-radius:12px; padding:10px 15px; margin-bottom:18px;\">\n        <span style=\"width:26px; height:26px; border-radius:7px; background:#259821; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;\">✦<\u002Fspan>\n        <span style=\"font-size:13.5px; color:#1E7E34; font-weight:600;\">Inputs from brief — <b>{{ linkedTitle }}<\u002Fb> · {{ linkedFormat }}<\u002Fspan>\n        <span onclick=\"{{ openSocialBrief }}\" style=\"cursor:pointer; font-size:12.5px; font-weight:700; color:#1E7E34; text-decoration:underline; margin-left:4px;\">Change<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ noLinkedBrief }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex; align-items:center; gap:14px; background:#fff; border:1px dashed #D8CDB2; border-radius:14px; padding:14px 18px; margin-bottom:18px;\">\n        <span style=\"width:34px; height:34px; border-radius:9px; background:#EAF6EC; color:#259821; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex:none;\">✦<\u002Fspan>\n        <div style=\"flex:1; min-width:0;\"><div style=\"font-weight:700; font-size:14px; color:#14331F;\">Start from a brief<\u002Fdiv><div style=\"font-size:12.5px; color:#A0937A;\">Pull the proposition, audience and tone from an approved brief so every post stays on-strategy.<\u002Fdiv><\u002Fdiv>\n        <button onclick=\"{{ openSocialBrief }}\" style=\"background:#259821; color:#fff; border:none; border-radius:11px; padding:11px 18px; font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap;\">Pull from brief<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"background:linear-gradient(135deg,#14331F,#1E7E34); border-radius:20px; padding:24px; margin-bottom:28px;\">\n      <div style=\"display:flex; gap:12px;\">\n        <input value=\"{{ socialObjective }}\" onchange=\"{{ onSocialObjective }}\" placeholder=\"e.g. Launch #PureDoodhKiShakti — purity from our farms to your home\" style=\"flex:1; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); border-radius:12px; padding:14px 16px; color:#fff; font-size:14px;\">\n        <button onclick=\"{{ generateSocial }}\" style=\"background:#E8A93C; color:#3A2A06; border:none; border-radius:12px; padding:14px 24px; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:9px;\">\n          <sc-if value=\"{{ socialGenerating }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:15px; height:15px; border:2px solid rgba(58,42,6,0.3); border-top-color:#3A2A06; border-radius:50%; display:inline-block; animation:hf-spin 0.7s linear infinite;\"><\u002Fspan><\u002Fsc-if>\n          {{ socialBtnLabel }}\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:9px; margin-top:14px;\">\n        <sc-for list=\"{{ platformChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <span onclick=\"{{ c.toggle }}\" style=\"cursor:pointer; background:{{ c.bg }}; color:{{ c.fg }}; border:1px solid {{ c.border }}; font-size:13px; font-weight:700; padding:7px 14px; border-radius:30px;\">{{ c.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- empty state -->\n    <sc-if value=\"{{ hasPosts }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;\">\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:700; color:#14331F; margin:0;\">Live previews<\u002Fh2>\n        <span style=\"font-size:13px; color:#A0937A;\">Captions are editable · adapt per platform<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:start; margin-bottom:36px;\">\n        <sc-for list=\"{{ posts }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"background:#fff; border-radius:16px; border:1px solid #E7E2D6; overflow:hidden; box-shadow:0 10px 28px -22px rgba(20,51,31,0.4);\">\n            <!-- header -->\n            <div style=\"display:flex; align-items:center; gap:10px; padding:13px 14px;\">\n              <span style=\"width:38px; height:38px; border-radius:50%; background:{{ p.accent }}; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex:none;\">{{ p.tag }}<\u002Fspan>\n              <div style=\"flex:1; min-width:0; line-height:1.25;\"><div style=\"font-weight:700; font-size:14px; color:#14331F;\">{{ p.handle }}<\u002Fdiv><div style=\"font-size:12px; color:#9AA09A;\">{{ p.sub }}<\u002Fdiv><\u002Fdiv>\n              <span style=\"color:#B6BBB4; font-weight:700; letter-spacing:1px;\">···<\u002Fspan>\n            <\u002Fdiv>\n            <!-- caption (IG shows below image; FB/LI above). Keep above for all for editability -->\n            <div style=\"padding:0 14px 12px; font-size:13.5px; line-height:1.55; color:#1F2D22; white-space:pre-line;\">{{ p.caption }}<\u002Fdiv>\n            <!-- creative visual -->\n            <div style=\"position:relative; aspect-ratio:1/1; background:linear-gradient(150deg,#1E7E34,#0C3A1C); display:flex; flex-direction:column; justify-content:flex-end; padding:18px; overflow:hidden;\">\n              <div style=\"position:absolute; right:-30px; top:-30px; width:140px; height:140px; border-radius:50%; background:rgba(232,169,60,0.22);\"><\u002Fdiv>\n              <div style=\"position:absolute; left:16px; top:16px; background:rgba(255,255,255,0.16); color:#fff; font-size:11px; font-weight:700; letter-spacing:0.04em; padding:4px 10px; border-radius:20px;\">#PureDoodhKiShakti<\u002Fdiv>\n              <div style=\"position:relative; color:rgba(255,255,255,0.9); font-size:12px; line-height:1.45;\"><span style=\"font-weight:700; color:#F5C86E;\">Key visual:<\u002Fspan> {{ p.visual }}<\u002Fdiv>\n            <\u002Fdiv>\n            <!-- hashtags -->\n            <div style=\"padding:11px 14px 6px; font-size:12.5px; color:{{ p.accent }}; font-weight:600; line-height:1.5;\">{{ p.hashtags }}<\u002Fdiv>\n            <!-- engagement bar -->\n            <div style=\"display:flex; gap:16px; padding:10px 14px 14px; border-top:1px solid #F2ECDD; font-size:12px; color:#7A8A7E; font-weight:600;\">\n              <span>♡ {{ p.likes }}<\u002Fspan><span>💬 {{ p.comments }}<\u002Fspan><span>↗ {{ p.shares }}<\u002Fspan>\n              <span style=\"margin-left:auto; background:{{ p.pillBg }}; color:{{ p.pillFg }}; padding:2px 9px; border-radius:20px; font-size:11px;\">{{ p.status }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- scheduler -->\n      <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;\">\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:700; color:#14331F; margin:0;\">Schedule<\u002Fh2>\n        <button onclick=\"{{ scheduleAll }}\" style=\"background:#259821; color:#fff; border:none; border-radius:11px; padding:11px 18px; font-weight:700; font-size:13.5px; cursor:pointer;\">Add all to calendar<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #ECE3CE; border-radius:16px; padding:18px; display:grid; grid-template-columns:repeat(7,1fr); gap:10px;\">\n        <sc-for list=\"{{ weekDays }}\" as=\"d\" hint-placeholder-count=\"7\">\n          <div style=\"min-height:120px;\">\n            <div style=\"font-size:12px; font-weight:700; color:#A0937A; text-align:center; padding-bottom:8px; border-bottom:1px solid #F2ECDD; margin-bottom:8px;\">{{ d.name }} <span style=\"color:#CFC4AC;\">{{ d.date }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:6px;\">\n              <sc-for list=\"{{ d.items }}\" as=\"it\" hint-placeholder-count=\"0\">\n                <div style=\"background:#FCFAF3; border-left:3px solid {{ it.accent }}; border-radius:6px; padding:6px 8px;\"><div style=\"font-size:11px; font-weight:700; color:#14331F;\">{{ it.platName }}<\u002Fdiv><div style=\"font-size:10px; color:#A0937A;\">{{ it.time }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ socialEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"text-align:center; padding:50px 20px; background:#fff; border:1px dashed #D8CDB2; border-radius:18px; color:#A0937A;\">\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:18px; font-weight:700; color:#14331F; margin-bottom:6px;\">Pick your platforms and hit generate<\u002Fdiv>\n        <div style=\"font-size:14px;\">You'll get an editable caption, hashtags and a live mockup for each — Facebook, Instagram and LinkedIn.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ socialGenerating }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center; padding:54px 20px; background:#fff; border:1px solid #ECE3CE; border-radius:18px; color:#A0937A;\">\n        <div style=\"width:28px; height:28px; border:3px solid #EAE3D2; border-top-color:#259821; border-radius:50%; margin:0 auto 14px; animation:hf-spin 0.7s linear infinite;\"><\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:16px; font-weight:700; color:#14331F;\">Writing posts for each platform…<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== VIDEO STUDIO ===================== -->\n  <sc-if value=\"{{ isVideo }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1100px; margin:0 auto; padding:36px 40px 80px; animation:hf-fade 0.4s ease;\">\n    <div style=\"margin-bottom:8px; font-size:13px; font-weight:700; letter-spacing:0.06em; color:#259821; text-transform:uppercase;\">Video Studio<\u002Fdiv>\n    <h1 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:34px; font-weight:700; letter-spacing:-0.02em; margin:0 0 6px; color:#14331F;\">Films built around an objective<\u002Fh1>\n    <p style=\"font-size:15px; color:#7A8A7E; margin:0 0 22px; max-width:640px;\">Choose a communication objective — the studio drafts a logline, script beats and a storyboard.<\u002Fp>\n\n    <sc-if value=\"{{ hasLinkedBrief }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:inline-flex; align-items:center; gap:12px; background:#EAF6EC; border:1px solid #C9E7CE; border-radius:12px; padding:10px 15px; margin-bottom:18px;\">\n        <span style=\"width:26px; height:26px; border-radius:7px; background:#259821; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;\">✦<\u002Fspan>\n        <span style=\"font-size:13.5px; color:#1E7E34; font-weight:600;\">Inputs from brief — <b>{{ linkedTitle }}<\u002Fb> · {{ linkedFormat }}<\u002Fspan>\n        <span onclick=\"{{ openVideoBrief }}\" style=\"cursor:pointer; font-size:12.5px; font-weight:700; color:#1E7E34; text-decoration:underline; margin-left:4px;\">Change<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ noLinkedBrief }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex; align-items:center; gap:14px; background:#fff; border:1px dashed #D8CDB2; border-radius:14px; padding:14px 18px; margin-bottom:18px;\">\n        <span style=\"width:34px; height:34px; border-radius:9px; background:#FBE3E1; color:#C0392B; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex:none;\">✦<\u002Fspan>\n        <div style=\"flex:1; min-width:0;\"><div style=\"font-weight:700; font-size:14px; color:#14331F;\">Start from a brief<\u002Fdiv><div style=\"font-size:12.5px; color:#A0937A;\">Pull the proposition, audience and tone from an approved brief to ground the film.<\u002Fdiv><\u002Fdiv>\n        <button onclick=\"{{ openVideoBrief }}\" style=\"background:#259821; color:#fff; border:none; border-radius:11px; padding:11px 18px; font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap;\">Pull from brief<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:14px; font-weight:700; color:#14331F; margin-bottom:12px;\">1 · Communication objective<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px;\">\n      <sc-for list=\"{{ videoObjectives }}\" as=\"v\" hint-placeholder-count=\"6\">\n        <div onclick=\"{{ v.pick }}\" style=\"background:#fff; border-radius:16px; padding:18px; border:2px solid {{ v.ring }}; cursor:pointer;\" style-hover=\"box-shadow:0 14px 26px -16px rgba(20,51,31,0.3);\">\n          <div style=\"width:38px; height:38px; border-radius:11px; background:{{ v.tint }}; display:flex; align-items:center; justify-content:center; margin-bottom:12px;\"><span style=\"border-left:12px solid {{ v.fg }}; border-top:7px solid transparent; border-bottom:7px solid transparent;\"><\u002Fspan><\u002Fdiv>\n          <div style=\"font-weight:700; font-size:15px; color:#14331F;\">{{ v.name }}<\u002Fdiv>\n          <div style=\"font-size:12px; color:#A0937A; margin-top:4px; line-height:1.45;\">{{ v.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:28px;\">\n      <button onclick=\"{{ generateVideo }}\" style=\"background:#259821; color:#fff; border:none; border-radius:12px; padding:14px 24px; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:9px;\">\n        <sc-if value=\"{{ videoGenerating }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:15px; height:15px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; display:inline-block; animation:hf-spin 0.7s linear infinite;\"><\u002Fspan><\u002Fsc-if>\n        {{ videoBtnLabel }}\n      <\u002Fbutton>\n      <sc-if value=\"{{ hasVideoObjective }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13.5px; color:#7A8A7E;\">Objective: <b style=\"color:#14331F;\">{{ videoObjectiveName }}<\u002Fb><\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasVideoConcept }}\" hint-placeholder-val=\"{{ false }}\">\n      <!-- logline + meta -->\n      <div style=\"background:linear-gradient(135deg,#14331F,#1E7E34); border-radius:20px; padding:28px; color:#fff; margin-bottom:24px; position:relative; overflow:hidden;\">\n        <div style=\"position:absolute; right:-40px; top:-40px; width:180px; height:180px; border-radius:50%; background:rgba(232,169,60,0.18);\"><\u002Fdiv>\n        <div style=\"font-size:12px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#F5C86E; margin-bottom:10px; position:relative;\">Logline<\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:23px; font-weight:600; line-height:1.3; letter-spacing:-0.01em; max-width:680px; position:relative;\">{{ videoConcept.logline }}<\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:18px; margin-top:20px; position:relative;\">\n          <div><div style=\"font-size:11px; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:0.06em;\">Cut<\u002Fdiv><div style=\"font-size:14px; font-weight:600;\">{{ videoConcept.duration }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1; min-width:200px;\"><div style=\"font-size:11px; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:0.06em;\">Voiceover<\u002Fdiv><div style=\"font-size:14px; font-weight:600; font-style:italic;\">{{ videoConcept.vo }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- storyboard -->\n      <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:700; color:#14331F; margin:0 0 16px;\">Storyboard &amp; script<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;\">\n        <sc-for list=\"{{ videoScenes }}\" as=\"sc\" hint-placeholder-count=\"4\">\n          <div style=\"background:#fff; border:1px solid #E7E2D6; border-radius:14px; overflow:hidden;\">\n            <div style=\"position:relative; aspect-ratio:16/9; background:{{ sc.grad }}; display:flex; align-items:flex-end; padding:12px; overflow:hidden;\">\n              <span style=\"position:absolute; left:10px; top:10px; background:rgba(0,0,0,0.35); color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;\">{{ sc.t }}<\u002Fspan>\n              <span style=\"position:absolute; right:10px; top:10px; width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,0.85); color:#14331F; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;\">{{ sc.idx }}<\u002Fspan>\n              <span style=\"color:#fff; font-weight:700; font-size:13px; position:relative; text-shadow:0 1px 4px rgba(0,0,0,0.4);\">{{ sc.title }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:12px 14px; font-size:12.5px; line-height:1.5; color:#3A4A3E;\">{{ sc.desc }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:12px;\">\n        <button style=\"background:#fff; color:#6E7E62; border:1px solid #ECE3CE; border-radius:12px; padding:13px 20px; font-weight:700; font-size:14px; cursor:pointer;\">Export script<\u002Fbutton>\n        <button style=\"background:#E8A93C; color:#3A2A06; border:none; border-radius:12px; padding:13px 22px; font-weight:700; font-size:14px; cursor:pointer;\">Send to agency for production<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== CAMPAIGN ANALYSIS ===================== -->\n  <sc-if value=\"{{ isCampaigns }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1240px; margin:0 auto; padding:36px 40px 80px; animation:hf-fade 0.4s ease;\">\n    <div style=\"margin-bottom:8px; font-size:13px; font-weight:700; letter-spacing:0.06em; color:#259821; text-transform:uppercase;\">Campaign Analysis<\u002Fdiv>\n    <h1 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:34px; font-weight:700; letter-spacing:-0.02em; margin:0 0 16px; color:#14331F;\">Performance against the brief<\u002Fh1>\n\n    <!-- campaign switcher -->\n    <div style=\"display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;\">\n      <sc-for list=\"{{ analysisOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n        <span onclick=\"{{ o.sel }}\" style=\"cursor:pointer; font-size:14px; font-weight:700; padding:9px 16px; border-radius:30px; background:{{ o.bg }}; color:{{ o.fg }}; border:1px solid {{ o.border }};\">{{ o.name }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- objective banner -->\n    <div style=\"background:#fff; border:1px solid #ECE3CE; border-left:4px solid #259821; border-radius:14px; padding:18px 22px; margin-bottom:24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;\">\n      <div style=\"flex:1; min-width:280px;\">\n        <div style=\"font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#A0937A; margin-bottom:4px;\">Objective — from media brief<\u002Fdiv>\n        <div style=\"font-size:15px; color:#14331F; font-weight:600; line-height:1.45;\">{{ analysisObjective }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right;\"><div style=\"font-size:12px; color:#A0937A;\">Reporting period<\u002Fdiv><div style=\"font-size:14px; font-weight:700; color:#14331F;\">{{ analysisDateRange }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- KPI grid vs objective -->\n    <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:700; color:#14331F; margin:0 0 14px;\">KPIs vs targets<\u002Fh2>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:30px;\">\n      <sc-for list=\"{{ aKpis }}\" as=\"k\" hint-placeholder-count=\"6\">\n        <div style=\"background:#fff; border:1px solid #ECE3CE; border-radius:16px; padding:20px;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;\">\n            <span style=\"font-size:13px; font-weight:700; color:#6E7E62; text-transform:uppercase; letter-spacing:0.04em;\">{{ k.label }}<\u002Fspan>\n            <span style=\"background:{{ k.pillBg }}; color:{{ k.color }}; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;\">{{ k.dirLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:30px; font-weight:700; color:#14331F; letter-spacing:-0.01em;\">{{ k.value }}<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:#A0937A; margin:2px 0 12px;\">Target {{ k.target }} · {{ k.sub }}<\u002Fdiv>\n          <div style=\"height:7px; background:#F0EDE3; border-radius:20px; overflow:hidden;\"><div style=\"width:{{ k.barPct }}%; height:100%; background:{{ k.color }}; border-radius:20px;\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- channels + trend -->\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:34px;\">\n      <div style=\"background:#fff; border:1px solid #ECE3CE; border-radius:16px; padding:22px;\">\n        <h3 style=\"margin:0 0 18px; font-family:'Bricolage Grotesque',sans-serif; font-size:17px; font-weight:700; color:#14331F;\">Channel contribution<\u002Fh3>\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <sc-for list=\"{{ aChannels }}\" as=\"ch\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:7px;\"><span style=\"font-weight:600; color:#14331F;\">{{ ch.name }}<\u002Fspan><span style=\"color:#7A8A7E; font-weight:600;\">{{ ch.pct }}% · {{ ch.spend }}<\u002Fspan><\u002Fdiv>\n              <div style=\"height:9px; background:#F0EDE3; border-radius:20px; overflow:hidden;\"><div style=\"width:{{ ch.pct }}%; height:100%; background:{{ ch.color }}; border-radius:20px;\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #ECE3CE; border-radius:16px; padding:22px;\">\n        <h3 style=\"margin:0 0 6px; font-family:'Bricolage Grotesque',sans-serif; font-size:17px; font-weight:700; color:#14331F;\">Weekly reach<\u002Fh3>\n        <div style=\"font-size:12.5px; color:#A0937A; margin-bottom:18px;\">Reach in millions, by week<\u002Fdiv>\n        <div style=\"display:flex; align-items:flex-end; gap:12px; height:150px;\">\n          <sc-for list=\"{{ aTrend }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end;\">\n              <span style=\"font-size:12px; font-weight:700; color:#1E7E34;\">{{ t.v }}<\u002Fspan>\n              <div style=\"width:100%; height:{{ t.h }}%; background:linear-gradient(180deg,#2EA043,#1E7E34); border-radius:7px 7px 0 0; min-height:6px;\"><\u002Fdiv>\n              <span style=\"font-size:11px; color:#A0937A;\">{{ t.w }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- audience quality assessment -->\n    <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:700; color:#14331F; margin:0 0 4px;\">Audience quality assessment<\u002Fh2>\n    <p style=\"font-size:14px; color:#7A8A7E; margin:0 0 16px;\">Composite quality score per targeted cohort — reach × engagement × conversion × retention.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:34px;\">\n      <sc-for list=\"{{ cohorts }}\" as=\"c\" hint-placeholder-count=\"5\">\n        <div style=\"background:#fff; border:1px solid #ECE3CE; border-radius:16px; padding:18px;\">\n          <div style=\"font-weight:700; font-size:14px; color:#14331F; line-height:1.3; min-height:36px;\">{{ c.name }}<\u002Fdiv>\n          <div style=\"font-size:12px; color:#A0937A; margin:2px 0 14px;\">{{ c.size }} reached<\u002Fdiv>\n          <div style=\"display:flex; align-items:baseline; gap:6px;\"><span style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:30px; font-weight:700; color:{{ c.gradeC }};\">{{ c.quality }}<\u002Fspan><span style=\"font-size:12px; color:#A0937A;\">/100<\u002Fspan><\u002Fdiv>\n          <div style=\"height:6px; background:#F0EDE3; border-radius:20px; overflow:hidden; margin:8px 0 12px;\"><div style=\"width:{{ c.quality }}%; height:100%; background:{{ c.gradeC }}; border-radius:20px;\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"display:inline-block; background:{{ c.gradeBg }}; color:{{ c.gradeC }}; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; margin-bottom:12px;\">{{ c.grade }} quality<\u002Fspan>\n          <div style=\"display:flex; flex-direction:column; gap:5px; font-size:12px; color:#5A6B5E;\">\n            <div style=\"display:flex; justify-content:space-between;\"><span style=\"color:#A0937A;\">Reach<\u002Fspan><b>{{ c.reach }}%<\u002Fb><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between;\"><span style=\"color:#A0937A;\">Engage<\u002Fspan><b>{{ c.eng }}<\u002Fb><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between;\"><span style=\"color:#A0937A;\">Convert<\u002Fspan><b>{{ c.conv }}<\u002Fb><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- cohort linkage across ecosystems -->\n    <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:700; color:#14331F; margin:0 0 4px;\">Cohort linkage across ecosystems<\u002Fh2>\n    <p style=\"font-size:14px; color:#7A8A7E; margin:0 0 16px;\">How one consumer cohort is identity-matched and activated across Meta, Alphabet and the quick-commerce ecosystem.<\u002Fp>\n    <div style=\"display:flex; gap:9px; margin-bottom:18px; flex-wrap:wrap;\">\n      <sc-for list=\"{{ cohorts }}\" as=\"c\" hint-placeholder-count=\"5\">\n        <span onclick=\"{{ c.sel }}\" style=\"cursor:pointer; font-size:13px; font-weight:700; padding:8px 14px; border-radius:30px; background:{{ c.chipBg }}; color:{{ c.chipFg }}; border:1px solid {{ c.chipBorder }};\">{{ c.name }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff; border:1px solid #ECE3CE; border-radius:18px; padding:24px;\">\n      <!-- unified cohort node -->\n      <div style=\"display:flex; align-items:center; gap:16px; background:linear-gradient(135deg,#14331F,#1E7E34); border-radius:14px; padding:18px 22px; color:#fff; margin-bottom:8px;\">\n        <span style=\"width:44px; height:44px; border-radius:12px; background:rgba(232,169,60,0.3); display:flex; align-items:center; justify-content:center; font-size:20px;\">✦<\u002Fspan>\n        <div style=\"flex:1;\"><div style=\"font-size:12px; color:rgba(255,255,255,0.6); text-transform:uppercase; letter-spacing:0.06em;\">Unified cohort<\u002Fdiv><div style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:700;\">{{ cohortName }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:right;\"><div style=\"font-size:12px; color:rgba(255,255,255,0.6);\">De-dup. addressable<\u002Fdiv><div style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:22px; font-weight:700; color:#F5C86E;\">{{ cohortAddressable }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:right; padding-left:18px; border-left:1px solid rgba(255,255,255,0.2);\"><div style=\"font-size:12px; color:rgba(255,255,255,0.6);\">Cross-eco overlap<\u002Fdiv><div style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:22px; font-weight:700;\">{{ cohortOverlap }}%<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <!-- connector -->\n      <div style=\"display:flex; justify-content:space-around; height:22px;\"><span style=\"width:2px; background:#D8CDB2;\"><\u002Fspan><span style=\"width:2px; background:#D8CDB2;\"><\u002Fspan><span style=\"width:2px; background:#D8CDB2;\"><\u002Fspan><\u002Fdiv>\n      <!-- ecosystem cards -->\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:16px;\">\n        <sc-for list=\"{{ linkEco }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <div style=\"border:1px solid #ECE3CE; border-radius:14px; padding:18px; border-top:4px solid {{ e.color }};\">\n            <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:14px;\">\n              <span style=\"width:34px; height:34px; border-radius:9px; background:{{ e.color }}; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;\">{{ e.tag }}<\u002Fspan>\n              <div style=\"line-height:1.25;\"><div style=\"font-weight:700; font-size:15px; color:#14331F;\">{{ e.eco }}<\u002Fdiv><div style=\"font-size:11px; color:#A0937A;\">{{ e.plat }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px; color:#14331F; font-weight:600; line-height:1.4; min-height:54px;\">{{ e.seg }}<\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#7A8A7E; margin:12px 0 6px;\"><span>Matched audience<\u002Fspan><b style=\"color:#14331F;\">{{ e.size }}<\u002Fb><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#7A8A7E; margin-bottom:6px;\"><span>ID match rate<\u002Fspan><b style=\"color:{{ e.color }};\">{{ e.matchPct }}%<\u002Fb><\u002Fdiv>\n            <div style=\"height:7px; background:#F0EDE3; border-radius:20px; overflow:hidden; margin-bottom:12px;\"><div style=\"width:{{ e.matchPct }}%; height:100%; background:{{ e.color }}; border-radius:20px;\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:11.5px; color:#A0937A; line-height:1.45;\"><b style=\"color:#6E7E62;\">Signal:<\u002Fb> {{ e.signal }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- AI insights -->\n    <div style=\"display:flex; align-items:center; justify-content:space-between; margin:34px 0 16px;\">\n      <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:700; color:#14331F; margin:0;\">AI insights &amp; recommendations<\u002Fh2>\n      <button onclick=\"{{ generateInsights }}\" style=\"background:#259821; color:#fff; border:none; border-radius:11px; padding:11px 18px; font-weight:700; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:9px;\">\n        <sc-if value=\"{{ insightsLoading }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:14px; height:14px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; display:inline-block; animation:hf-spin 0.7s linear infinite;\"><\u002Fspan><\u002Fsc-if>\n        ✦ Analyse with AI\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasInsights }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px;\">\n        <sc-for list=\"{{ insights }}\" as=\"i\" hint-placeholder-count=\"4\">\n          <div style=\"background:#fff; border:1px solid #ECE3CE; border-left:4px solid {{ i.color }}; border-radius:14px; padding:18px 20px;\">\n            <span style=\"display:inline-block; background:{{ i.bg }}; color:{{ i.color }}; font-size:11px; font-weight:700; padding:3px 11px; border-radius:20px; margin-bottom:10px;\">{{ i.kind }}<\u002Fspan>\n            <div style=\"font-size:13.5px; line-height:1.55; color:#2A3A2E;\">{{ i.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ noInsights }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"text-align:center; padding:34px 20px; background:#fff; border:1px dashed #D8CDB2; border-radius:16px; color:#A0937A; font-size:14px;\">Hit <b style=\"color:#14331F;\">Analyse with AI<\u002Fb> to surface wins, opportunities and cross-ecosystem recommendations from this data.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== CAMPAIGN WORKSPACE ===================== -->\n  <sc-if value=\"{{ isCampaign }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1180px; margin:0 auto; padding:32px 40px 80px; animation:hf-fade 0.4s ease;\">\n    <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:18px;\">\n      <span onclick=\"{{ goBriefs }}\" style=\"cursor:pointer; font-size:14px; font-weight:600; color:#7A8A7E;\">← Briefs<\u002Fspan>\n      <span style=\"color:#CFC4AC;\">/<\u002Fspan>\n      <span style=\"font-size:14px; font-weight:700; color:#14331F;\">Campaign<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- campaign header -->\n    <div style=\"background:linear-gradient(135deg,#1E7E34,#14331F); border-radius:22px; padding:32px; color:#fff; position:relative; overflow:hidden; margin-bottom:26px;\">\n      <div style=\"position:absolute; right:-50px; top:-50px; width:220px; height:220px; border-radius:50%; background:rgba(232,169,60,0.2);\"><\u002Fdiv>\n      <div style=\"position:relative;\">\n        <span style=\"display:inline-block; background:rgba(255,255,255,0.16); padding:5px 13px; border-radius:30px; font-size:12px; font-weight:700; letter-spacing:0.04em;\">#PureDoodhKiShakti · Integrated campaign<\u002Fspan>\n        <h1 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:32px; font-weight:700; letter-spacing:-0.02em; margin:14px 0 8px;\">{{ campaignName }}<\u002Fh1>\n        <sc-if value=\"{{ hasLinkedBrief }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:inline-flex; align-items:center; gap:9px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); border-radius:11px; padding:8px 13px; font-size:13px; font-weight:600;\">✦ Built from brief — {{ linkedTitle }} · {{ linkedFormat }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- generating -->\n    <sc-if value=\"{{ campaignGenerating }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"text-align:center; padding:60px 20px; background:#fff; border:1px solid #ECE3CE; border-radius:18px; color:#A0937A;\">\n        <div style=\"width:30px; height:30px; border:3px solid #EAE3D2; border-top-color:#259821; border-radius:50%; margin:0 auto 16px; animation:hf-spin 0.7s linear infinite;\"><\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:17px; font-weight:700; color:#14331F;\">Generating your campaign…<\u002Fdiv>\n        <div style=\"font-size:13.5px; margin-top:4px;\">Posts for every platform and a film concept, all from your brief.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- assets -->\n    <sc-if value=\"{{ hasCampVideo }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;\">\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:700; color:#14331F; margin:0;\">Campaign assets <span style=\"color:#A0937A; font-weight:600; font-size:15px;\">· {{ campAssetCount }} pieces<\u002Fspan><\u002Fh2>\n        <button onclick=\"{{ generateCampaign }}\" style=\"background:#fff; color:#6E7E62; border:1px solid #ECE3CE; border-radius:11px; padding:10px 16px; font-weight:700; font-size:13.5px; cursor:pointer;\">↻ Regenerate<\u002Fbutton>\n      <\u002Fdiv>\n\n      <!-- social posts -->\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:18px;\">\n        <sc-for list=\"{{ campPosts }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"background:#fff; border-radius:14px; border:1px solid #E7E2D6; overflow:hidden;\">\n            <div style=\"display:flex; align-items:center; gap:9px; padding:12px 13px;\">\n              <span style=\"width:32px; height:32px; border-radius:50%; background:{{ p.accent }}; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;\">{{ p.tag }}<\u002Fspan>\n              <div style=\"flex:1; min-width:0;\"><div style=\"font-weight:700; font-size:13px; color:#14331F;\">{{ p.platName }}<\u002Fdiv><div style=\"font-size:11px; color:#9AA09A;\">Post<\u002Fdiv><\u002Fdiv>\n              <span style=\"background:{{ p.pillBg }}; color:{{ p.pillFg }}; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;\">{{ p.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:0 13px 11px; font-size:12.5px; line-height:1.5; color:#1F2D22; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;\">{{ p.caption }}<\u002Fdiv>\n            <div style=\"aspect-ratio:16/9; background:linear-gradient(150deg,#1E7E34,#0C3A1C); display:flex; align-items:flex-end; padding:11px;\"><span style=\"color:rgba(255,255,255,0.85); font-size:11px;\"><b style=\"color:#F5C86E;\">Visual:<\u002Fb> {{ p.visual }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- video asset -->\n      <div onclick=\"{{ openVideoFromCampaign }}\" style=\"background:#fff; border:1px solid #E7E2D6; border-radius:14px; padding:18px; display:flex; gap:18px; align-items:center; cursor:pointer; margin-bottom:26px;\" style-hover=\"box-shadow:0 14px 26px -18px rgba(20,51,31,0.3);\">\n        <div style=\"width:150px; aspect-ratio:16/9; border-radius:10px; background:linear-gradient(135deg,#E2231A,#8E1610); flex:none; display:flex; align-items:center; justify-content:center;\"><span style=\"border-left:18px solid #fff; border-top:12px solid transparent; border-bottom:12px solid transparent;\"><\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1; min-width:0;\">\n          <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:6px;\"><span style=\"font-weight:800; font-family:'Bricolage Grotesque',sans-serif; font-size:12px; color:#C0392B; background:#FBE3E1; padding:2px 9px; border-radius:6px;\">FILM<\u002Fspan><span style=\"font-size:13px; color:#A0937A;\">{{ campVideo.duration }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-weight:700; font-size:15px; color:#14331F; line-height:1.35;\">{{ campVideo.logline }}<\u002Fdiv>\n          <div style=\"font-size:13px; color:#7A8A7E; margin-top:4px;\">Open in Video Studio to see the storyboard →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; gap:12px;\">\n        <button onclick=\"{{ openPostsFromCampaign }}\" style=\"background:#fff; color:#14331F; border:1px solid #ECE3CE; border-radius:12px; padding:13px 20px; font-weight:700; font-size:14px; cursor:pointer;\">Open posts in Social Studio<\u002Fbutton>\n        <button style=\"background:#259821; color:#fff; border:none; border-radius:12px; padding:13px 22px; font-weight:700; font-size:14px; cursor:pointer; margin-left:auto;\">Submit campaign for approval<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== BRIEF PICKER ===================== -->\n  <sc-if value=\"{{ briefPickerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div onclick=\"{{ closeBriefPicker }}\" style=\"position:fixed; inset:0; z-index:100; background:rgba(12,32,18,0.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:24px; animation:hf-fade 0.25s ease;\">\n    <div style=\"background:#FBF6EA; border-radius:24px; padding:32px; max-width:640px; width:100%; box-shadow:0 40px 90px -30px rgba(8,43,21,0.6);\">\n      <div style=\"font-size:13px; font-weight:700; letter-spacing:0.06em; color:#259821; text-transform:uppercase; margin-bottom:6px;\">Pull from a brief<\u002Fdiv>\n      <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:24px; font-weight:700; letter-spacing:-0.02em; color:#14331F; margin:0 0 4px;\">Choose the brief to work from<\u002Fh2>\n      <p style=\"font-size:14px; color:#7A8A7E; margin:0 0 22px;\">Its proposition, audience and tone are carried into what you generate.<\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:10px; max-height:380px; overflow-y:auto;\">\n        <sc-for list=\"{{ briefLibrary }}\" as=\"b\" hint-placeholder-count=\"4\">\n          <div onclick=\"{{ b.pick }}\" style=\"display:flex; align-items:center; gap:14px; background:#fff; border:1px solid #ECE3CE; border-radius:14px; padding:15px 16px; cursor:pointer;\" style-hover=\"border-color:#259821; box-shadow:0 10px 22px -16px rgba(20,51,31,0.3);\">\n            <span style=\"width:42px; height:42px; border-radius:11px; background:{{ b.tint }}; color:{{ b.fg }}; display:flex; align-items:center; justify-content:center; font-weight:800; font-family:'Bricolage Grotesque',sans-serif; font-size:14px; flex:none;\">{{ b.tag }}<\u002Fspan>\n            <div style=\"flex:1; min-width:0;\">\n              <div style=\"font-weight:700; font-size:14.5px; color:#14331F;\">{{ b.title }}<\u002Fdiv>\n              <div style=\"font-size:12px; color:#A0937A; margin-top:1px;\">{{ b.format }} · {{ b.meta }}<\u002Fdiv>\n              <div style=\"font-size:12.5px; color:#5A6B5E; margin-top:6px; line-height:1.45; font-style:italic;\">“{{ b.proposition }}”<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"color:#259821; font-weight:800; font-size:18px;\">→<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex; justify-content:flex-end; margin-top:18px;\">\n        <button onclick=\"{{ closeBriefPicker }}\" style=\"background:transparent; color:#7A8A7E; border:none; font-weight:700; font-size:14px; cursor:pointer;\">Cancel<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== CREATE-CONTENT LAUNCHER ===================== -->\n  <sc-if value=\"{{ launcherOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div onclick=\"{{ closeLauncher }}\" style=\"position:fixed; inset:0; z-index:100; background:rgba(12,32,18,0.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:24px; animation:hf-fade 0.25s ease;\">\n    <div style=\"background:#FBF6EA; border-radius:24px; padding:34px; max-width:760px; width:100%; box-shadow:0 40px 90px -30px rgba(8,43,21,0.6);\">\n      <div style=\"font-size:13px; font-weight:700; letter-spacing:0.06em; color:#259821; text-transform:uppercase; margin-bottom:6px;\">Activate this brief<\u002Fdiv>\n      <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-size:26px; font-weight:700; letter-spacing:-0.02em; color:#14331F; margin:0 0 4px;\">Turn the brief into content<\u002Fh2>\n      <p style=\"font-size:14px; color:#7A8A7E; margin:0 0 24px;\">Everything you generate stays linked to <b style=\"color:#14331F;\">{{ title }}<\u002Fb> — its proposition, audience and tone carry through.<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:14px;\">\n        <div onclick=\"{{ activatePost }}\" style=\"background:#fff; border:1px solid #ECE3CE; border-radius:18px; padding:22px; cursor:pointer;\" style-hover=\"transform:translateY(-3px); box-shadow:0 16px 30px -18px rgba(20,51,31,0.3);\">\n          <div style=\"width:46px; height:46px; border-radius:13px; background:#FDEEDA; display:flex; align-items:center; justify-content:center; margin-bottom:16px;\"><span style=\"width:18px; height:18px; border:2.5px solid #E8A93C; border-radius:50%;\"><\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px; color:#14331F;\">Social posts<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:#A0937A; margin-top:5px; line-height:1.45;\">One idea adapted to FB, Instagram &amp; LinkedIn with live previews.<\u002Fdiv>\n        <\u002Fdiv>\n        <div onclick=\"{{ activateVideo }}\" style=\"background:#fff; border:1px solid #ECE3CE; border-radius:18px; padding:22px; cursor:pointer;\" style-hover=\"transform:translateY(-3px); box-shadow:0 16px 30px -18px rgba(20,51,31,0.3);\">\n          <div style=\"width:46px; height:46px; border-radius:13px; background:#FBE3E1; display:flex; align-items:center; justify-content:center; margin-bottom:16px;\"><span style=\"border-left:14px solid #E2231A; border-top:9px solid transparent; border-bottom:9px solid transparent;\"><\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px; color:#14331F;\">Video film<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:#A0937A; margin-top:5px; line-height:1.45;\">A script &amp; storyboard built around the brief's objective.<\u002Fdiv>\n        <\u002Fdiv>\n        <div onclick=\"{{ activateCampaign }}\" style=\"background:linear-gradient(135deg,#1E7E34,#14331F); border:1px solid #14331F; border-radius:18px; padding:22px; cursor:pointer; position:relative; overflow:hidden;\" style-hover=\"transform:translateY(-3px); box-shadow:0 16px 34px -16px rgba(20,51,31,0.5);\">\n          <div style=\"position:absolute; right:-24px; top:-24px; width:90px; height:90px; border-radius:50%; background:rgba(232,169,60,0.22);\"><\u002Fdiv>\n          <div style=\"width:46px; height:46px; border-radius:13px; background:rgba(232,169,60,0.25); display:flex; align-items:center; justify-content:center; margin-bottom:16px; position:relative;\"><span style=\"color:#F5C86E; font-size:20px; line-height:1;\">✦<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px; color:#fff; position:relative;\">Full campaign<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:rgba(255,255,255,0.78); margin-top:5px; line-height:1.45; position:relative;\">Multiple posts <b style=\"color:#F5C86E;\">+ a film<\u002Fb>, generated together as one campaign.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; justify-content:flex-end; margin-top:22px;\">\n        <button onclick=\"{{ closeLauncher }}\" style=\"background:transparent; color:#7A8A7E; border:none; font-weight:700; font-size:14px; cursor:pointer;\">Cancel<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;managerName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ananya&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;reviewerMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'home',\n    format: 'comms',\n    title: 'Untitled brief',\n    brief: { background:'', businessObjective:'', commObjective:'', audience:'', insight:'', competition:'', proposition:'', rtbs:'', tone:'', mandatories:'', deliverables:'', budget:'', timeline:'', kpis:'' },\n    aiPrompt: '',\n    generating: false,\n    status: 'Draft',\n    historyFilter: 'All',\n    // linkage\n    linkedBrief: null,\n    launcherOpen: false,\n    briefPickerOpen: false,\n    briefPickerFor: 'social',\n    // brand kit + assets\n    driveConnected: false,\n    attached: { guidelines:false, template:null, assets:[] },\n    assetPickerOpen: false,\n    assetPickerFor: 'social',\n    // creative cross-check\n    socialCheck: null,\n    videoCheck: null,\n    checkLoading: false,\n    // social\n    socialObjective: '',\n    socialPlatforms: { facebook:true, instagram:true, linkedin:true },\n    socialGenerating: false,\n    posts: [],\n    scheduled: false,\n    // video\n    videoObjective: null,\n    videoGenerating: false,\n    videoConcept: null,\n    // campaign\n    campaign: null,\n    campaignGenerating: false,\n    // created-content log (history + approvals)\n    created: [],\n    // campaign analysis\n    analysisSel: 'pure',\n    selCohort: 0,\n    insights: null,\n    insightsLoading: false,\n  };\n\n  FORMATS = [\n    { id:'comms',   tag:'CO', name:'Communications', tint:'#EAF6EC', fg:'#1E7E34', desc:'Core message, audience and proposition for a campaign or always-on comms.' },\n    { id:'media',   tag:'ME', name:'Media',          tint:'#E6F0FB', fg:'#2E6FB0', desc:'Channel mix, reach & frequency goals, budgets and flighting.' },\n    { id:'digital', tag:'DG', name:'Digital',        tint:'#FDEEDA', fg:'#C8860F', desc:'Performance & social objectives, formats, funnels and KPIs.' },\n    { id:'pack',    tag:'PK', name:'Packaging',      tint:'#FBE3E1', fg:'#C0392B', desc:'Pack architecture, claims, regulatory mandatories and shelf impact.' },\n    { id:'product', tag:'PD', name:'Product Development', tint:'#EFE8FA', fg:'#6B4FB0', desc:'Consumer need, concept, RTBs and launch readiness.' },\n    { id:'pr',      tag:'PR', name:'Public Relations', tint:'#E9F4F2', fg:'#1A8A7A', desc:'Narrative, spokespeople, milestones and earned-media angles.' },\n    { id:'imc',     tag:'IM', name:'IMC', tint:'#FCEFC7', fg:'#A77A00', desc:'Integrated comms plan tying every channel to one big idea.' },\n  ];\n\n  fmt(id){ return this.FORMATS.find(f=>f.id===id) || this.FORMATS[0]; }\n\n  go = (screen) => () => this.setState({ screen });\n\n  openFormat = (id) => () => {\n    this.setState({ screen:'editor', format:id, status:'Draft', title:this.fmt(id).name+' brief — Pure Milk',\n      aiPrompt:'', brief:{ ...this.formatDefaults(id) } });\n  };\n\n  formatDefaults(id){\n    const map = {\n      comms:   { deliverables:'Master film (30s + 20s + 10s), key visual, radio adaptation.', mandatories:'Heritage logo lock-up, #PureDoodhKiShakti, FSSAI mark, purity claim substantiation.', budget:'Indicative working + non-working split (to be confirmed with finance).', timeline:'Brief sign-off → agency response (2 wks) → production → festive go-live.' },\n      imc:     { deliverables:'One-big-idea deck, channel role matrix, phasing plan, budget by channel.', mandatories:'Consistent brand codes across every channel, master KPI framework.', channelRoles:'ATL builds salience; digital drives consideration & action; retail/parlour converts; PR earns trust.', budget:'Total integrated budget split by channel and phase.', timeline:'Big-idea sign-off → channel briefs → phased festive rollout.' },\n      media:   { deliverables:'Channel plan, reach & frequency curve, flighting calendar, budget split by medium.', budget:'Total media budget with split across TV, digital, OOH and retail.' },\n      digital: { deliverables:'Meta + YouTube + Google assets in 9:16 / 1:1 / 16:9, landing page.', targeting:'Audience segments & lookalikes, geo + interest targeting, UTMs and pixel/CAPI tracking.', budget:'Spend split by platform and funnel stage, with daily caps.' },\n      pack:    { mandatories:'Heritage brand block, FSSAI & green veg mark, nutrition panel, legal claims, MRP/batch zones.', formats:'SKUs: 500ml & 1L pouch, 1L carton; variant colour ladder.', deliverables:'Front-of-pack, back-of-pack, variant ladder, dieline, 3D shelf mock.', timeline:'Design → legal vetting → print proofs → plant changeover.' },\n      product: { feasibility:'Confirm shelf-life, plant capability and FSSAI/regulatory clearance before scale-up.', deliverables:'Concept board, RTB ladder, pricing ladder, sensory results, launch checklist.', launch:'Pilot in lead market → review → phased state roll-out across the year.' },\n      pr:      { deliverables:'Press release, curated media list, spokesperson Q&A, milestone calendar.', mandatories:'Approved spokesperson quotes, embargo timing, leadership sign-off.', milestones:'Announcement → media briefings → coverage tracking over 4 weeks.' },\n    };\n    return map[id] || {};\n  }\n\n  SECTIONS = {\n    comms: [\n      { title:'Strategic foundation', fields:[\n        ['background','Background & context','What business or market situation prompts this brief?'],\n        ['businessObjective','Business objective','The commercial goal \\u2014 sales, share, penetration, trials.'],\n        ['commObjective','Communication objective','What the communication must achieve \\u2014 awareness, consideration, action.'],\n      ]},\n      { title:'Audience & insight', fields:[\n        ['audience','Target audience','Demographics, geography, category role and occasions.'],\n        ['insight','Consumer insight','The human truth or tension the work taps into.'],\n      ]},\n      { title:'Positioning', fields:[\n        ['competition','Competitive context','Who/what we\\u2019re up against and how we differ.'],\n        ['proposition','Single-minded proposition','The one thought to land in the audience\\u2019s mind.'],\n        ['rtbs','Reasons to believe','Proof points that make the proposition credible.'],\n      ]},\n      { title:'Brand expression', fields:[\n        ['tone','Tone & personality','How it should feel and sound.'],\n        ['mandatories','Mandatories & brand codes','Logos, claims, legal, brand assets that must appear.'],\n      ]},\n      { title:'Execution & measurement', fields:[\n        ['deliverables','Deliverables & channels','What exactly needs to be produced, and where.'],\n        ['budget','Budget','Indicative budget / cost guardrails.'],\n        ['timeline','Timeline & milestones','Key dates and approval gates.'],\n        ['kpis','Success metrics / KPIs','How we\\u2019ll measure success.'],\n      ]},\n    ],\n    imc: [\n      { title:'Strategic foundation', fields:[\n        ['background','Background & context','What business or market situation prompts this brief?'],\n        ['businessObjective','Business objective','The commercial goal across the integrated effort.'],\n        ['commObjective','Communication objective','What the integrated communication must achieve.'],\n      ]},\n      { title:'Audience & insight', fields:[\n        ['audience','Target audience','Demographics, geography, category role and occasions.'],\n        ['insight','Consumer insight','The human truth or tension the work taps into.'],\n      ]},\n      { title:'The big idea', fields:[\n        ['competition','Competitive context','Who/what we\\u2019re up against and how we differ.'],\n        ['proposition','Single-minded proposition','The one thought to land across every channel.'],\n        ['bigIdea','The one big idea','The unifying creative idea that travels across touchpoints.'],\n        ['rtbs','Reasons to believe','Proof points that make the proposition credible.'],\n      ]},\n      { title:'Integration', fields:[\n        ['channelRoles','Role of each channel','How ATL, digital, retail & PR each contribute to the idea.'],\n        ['tone','Tone & personality','How it should feel and sound, consistently.'],\n        ['mandatories','Mandatories & brand codes','Codes and assets that must stay consistent everywhere.'],\n      ]},\n      { title:'Execution & measurement', fields:[\n        ['deliverables','Deliverables & channels','What needs producing across every channel.'],\n        ['budget','Budget by channel','How investment splits across channels and phases.'],\n        ['timeline','Phasing & milestones','How the campaign phases over time.'],\n        ['kpis','Success metrics / KPIs','The master KPI framework.'],\n      ]},\n    ],\n    media: [\n      { title:'Strategic foundation', fields:[\n        ['background','Background & context','Market, seasonality and media-landscape context.'],\n        ['businessObjective','Business objective','The commercial goal this media plan supports.'],\n        ['commObjective','Media objective','Reach, frequency and outcome the plan must deliver.'],\n      ]},\n      { title:'Audience', fields:[\n        ['audience','Target audience','Who we are buying \\u2014 demographics, geography, role.'],\n        ['mediaHabits','Media consumption habits','When/where they watch, scroll, listen and shop.'],\n      ]},\n      { title:'Media strategy', fields:[\n        ['channelMix','Channel mix & role','Which channels, and the job each one does.'],\n        ['reachGoals','Reach & frequency goals','1+/3+ reach targets and effective frequency.'],\n        ['markets','Markets & flighting','Priority markets and how spend is flighted.'],\n      ]},\n      { title:'Investment & deliverables', fields:[\n        ['budget','Budget','Total budget and split across media.'],\n        ['deliverables','Deliverables','Plan, calendar and reporting outputs.'],\n      ]},\n      { title:'Measurement', fields:[\n        ['kpis','Media KPIs','Reach, GRPs, CPM/CPRP efficiency, ROAS.'],\n      ]},\n    ],\n    digital: [\n      { title:'Strategic foundation', fields:[\n        ['background','Background & context','Digital landscape and where the brand stands.'],\n        ['businessObjective','Business objective','The commercial outcome \\u2014 trials, subscriptions, repeat.'],\n        ['commObjective','Digital objective','Awareness, consideration or conversion goal.'],\n      ]},\n      { title:'Audience', fields:[\n        ['audience','Target audience & segments','Core segments and who we retarget.'],\n        ['digitalBehaviour','Digital behaviour & platforms','Where they discover, research and transact.'],\n      ]},\n      { title:'Approach', fields:[\n        ['funnel','Funnel & customer journey','How content moves people from reach to action.'],\n        ['proposition','Key message','The core message for the work.'],\n        ['formats','Formats & assets','The creative formats and cuts needed.'],\n      ]},\n      { title:'Execution', fields:[\n        ['deliverables','Deliverables','Assets, landing pages and CRM outputs.'],\n        ['targeting','Targeting & tracking','Audiences, geo/interest targeting, UTMs and tracking.'],\n        ['budget','Budget','Spend by platform and funnel stage.'],\n      ]},\n      { title:'Measurement', fields:[\n        ['kpis','Digital KPIs','CTR, CPA, install\\u2192subscribe, ROAS, engagement.'],\n      ]},\n    ],\n    pack: [\n      { title:'Context', fields:[\n        ['background','Background & context','Why the pack needs to evolve now.'],\n        ['commObjective','Role of the pack','The job the pack must do at the shelf.'],\n        ['rangeArch','Range architecture','How variants relate within one family look.'],\n      ]},\n      { title:'Consumer & shelf', fields:[\n        ['audience','Target consumer','Who picks it up and what they value.'],\n        ['shelfContext','Shelf & competitive context','How it competes and blocks on shelf.'],\n      ]},\n      { title:'Design direction', fields:[\n        ['packHierarchy','Pack hierarchy & key info','The order of information front-of-pack.'],\n        ['claims','Claims & RTBs','Claims to feature and their substantiation.'],\n        ['mandatories','Brand codes & legal mandatories','Brand block, legal, FSSAI, nutrition, MRP/batch.'],\n      ]},\n      { title:'Execution', fields:[\n        ['formats','Formats & SKUs','Pack formats, sizes and variant ladder.'],\n        ['deliverables','Deliverables','FOP/BOP, dieline, 3D mock outputs.'],\n        ['timeline','Timeline & milestones','Design → legal → proofs → plant changeover.'],\n      ]},\n      { title:'Measurement', fields:[\n        ['kpis','Success criteria','Findability, variant clarity, intent uplift.'],\n      ]},\n    ],\n    product: [\n      { title:'Opportunity', fields:[\n        ['background','Market context & gap','The unmet need or whitespace in market.'],\n        ['businessObjective','Business objective','Incremental volume, mix or premiumisation goal.'],\n        ['consumerNeed','Consumer need','The functional/emotional need being served.'],\n      ]},\n      { title:'Consumer', fields:[\n        ['audience','Target consumer','Who the product is for.'],\n        ['insight','Consumer insight','The human truth behind the need.'],\n      ]},\n      { title:'Concept', fields:[\n        ['concept','Product concept','What the product is and how it works.'],\n        ['rtbs','Benefits & RTBs','Benefits and the reasons to believe.'],\n        ['pricing','Pricing & positioning','Price ladder and where it sits in the range.'],\n      ]},\n      { title:'Feasibility & launch', fields:[\n        ['feasibility','Quality, regulatory & feasibility','Shelf-life, plant capability, clearances.'],\n        ['deliverables','Deliverables','Concept board, sensory, launch checklist.'],\n        ['launch','Launch plan & timeline','Pilot, review and roll-out phasing.'],\n      ]},\n      { title:'Measurement', fields:[\n        ['kpis','Success metrics','Trial, repeat, distribution, margin.'],\n      ]},\n    ],\n    pr: [\n      { title:'Context', fields:[\n        ['background','Background & context','The reputation situation and opportunity.'],\n        ['businessObjective','Reputation / business objective','What trust or reputation goal this serves.'],\n        ['commObjective','Communication objective','What earned media must achieve.'],\n      ]},\n      { title:'Audience', fields:[\n        ['stakeholders','Target media & stakeholders','Press, influencers and stakeholders to reach.'],\n        ['insight','Insight / angle','The truth that makes the story land.'],\n      ]},\n      { title:'Narrative', fields:[\n        ['narrative','Core narrative & angles','The story and the angles we can pitch.'],\n        ['messages','Key messages','The messages every piece must carry.'],\n        ['spokespeople','Spokespeople & proof points','Who speaks and the proof they bring.'],\n      ]},\n      { title:'Execution', fields:[\n        ['deliverables','Deliverables','Release, media list, Q&A, calendar.'],\n        ['mandatories','Approvals & embargo','Sign-offs, quotes and embargo timing.'],\n        ['milestones','Milestones','Announcement, briefings and tracking.'],\n      ]},\n      { title:'Measurement', fields:[\n        ['kpis','KPIs','Coverage, share of voice, message pull-through, sentiment.'],\n      ]},\n    ],\n  };\n\n  aiKeysFor(fmt){\n    const map = {\n      comms:   ['background','businessObjective','commObjective','audience','insight','competition','proposition','rtbs','tone','kpis'],\n      imc:     ['background','businessObjective','commObjective','audience','insight','competition','proposition','bigIdea','rtbs','tone','kpis'],\n      media:   ['background','businessObjective','commObjective','audience','mediaHabits','channelMix','reachGoals','markets','kpis'],\n      digital: ['background','businessObjective','commObjective','audience','digitalBehaviour','funnel','proposition','formats','kpis'],\n      pack:    ['background','commObjective','rangeArch','audience','shelfContext','packHierarchy','claims','kpis'],\n      product: ['background','businessObjective','consumerNeed','audience','insight','concept','rtbs','pricing','kpis'],\n      pr:      ['background','businessObjective','commObjective','stakeholders','insight','narrative','messages','spokespeople','kpis'],\n    };\n    return map[fmt] || map.comms;\n  }\n\n  fallbackFor(fmt){\n    const base = this.fallbackDraft();\n    if (fmt === 'comms') return base;\n    if (fmt === 'imc') return { ...base, bigIdea:'\\u201cPurity that powers your family, every day\\u201d \\u2014 one idea expressed consistently across film, digital, retail and PR.' };\n    const M = {\n      media: {\n        background:'Pure Milk\\u2019s festive volumes peak across the south, but media inflation and fragmented viewing make efficient reach harder each year.',\n        businessObjective:'Deliver 8% volume growth in core markets while improving cost-per-reach versus last festive.',\n        commObjective:'Maximise efficient reach and frequency against young families through the festive window.',\n        audience:'Young urban families (28\\u201340) in Telangana, AP, Karnataka & Tamil Nadu; primary grocery deciders.',\n        mediaHabits:'Heavy regional GEC + cricket on TV; YouTube and Instagram on mobile; strong vernacular consumption.',\n        channelMix:'Regional TV for reach, digital video for frequency & targeting, OOH near retail, in-parlour at point of sale.',\n        reachGoals:'1+ reach 75% / 3+ reach 45% on target across 6 festive weeks.',\n        markets:'Lead: Hyderabad, Vijayawada, Bengaluru, Chennai; spend concentrated 3 weeks pre-Diwali.',\n        kpis:'Reach & frequency vs plan, CPRP/CPM efficiency, view-through, and 3.0x+ ROAS.',\n      },\n      digital: {\n        background:'Pure Milk over-indexes on awareness but under-converts to app trials and repeat orders.',\n        businessObjective:'Grow Heritage Tuch app subscriptions and repeat orders during the festive quarter.',\n        commObjective:'Move young families from awareness
